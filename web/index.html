<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>detikGlobal — Generate New Article</title>
<style>
  :root {
    --border:#e5e7eb; --muted:#6b7280; --navy:#0f2148; --blue:#1a3a7a; --red:#c0392b;
    --bg:#ffffff; --card:#f6f7f9;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#1c2530;display:flex;flex-direction:column;}
  header{padding:16px 24px;border-bottom:2px solid var(--navy);flex:0 0 auto;}
  header h1{margin:0 0 4px;font-size:20px;color:var(--navy);}
  header p{margin:0;color:var(--muted);font-size:13px;}

  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--border);flex:0 0 auto;}
  .toolbar label{font-size:13px;color:var(--navy);font-weight:600;}
  .toolbar select,.toolbar input{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--border);border-radius:6px;max-width:560px;background:#fff;}
  .toolbar select:focus,.toolbar input:focus{outline:2px solid #c7d4f2;outline-offset:0;border-color:var(--blue);}
  .toolbar input{flex:1 1 340px;min-width:240px;}
  .toolbar .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;width:100%;}
  .toolbar .sep{width:100%;border-top:1px dashed var(--border);}
  .tabs{display:flex;gap:4px;width:100%;border-bottom:1px solid var(--border);margin-bottom:2px;}
  .tab{font:inherit;font-size:13px;font-weight:600;padding:7px 14px;border:1px solid var(--border);border-bottom:none;border-radius:6px 6px 0 0;background:#fff;color:var(--muted);cursor:pointer;margin-bottom:-1px;}
  .tab:hover:not(.active){background:#eef2fb;}
  .tab.active{color:var(--navy);border-color:var(--navy);border-bottom:1px solid #fff;background:#fff;}
  .panel{display:none;width:100%;}
  .panel.active{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
  .presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;width:100%;max-width:900px;}
  @media (max-width:640px){ .presets{grid-template-columns:1fr;} }
  .preset{position:relative;display:block;padding:12px 14px 12px 38px;background:#fff;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:border-color .15s,box-shadow .15s,background .15s;}
  .preset:hover{border-color:#c7d4f2;background:#fbfcff;}
  .preset input{position:absolute;opacity:0;pointer-events:none;}
  .preset .dot{position:absolute;left:14px;top:14px;width:14px;height:14px;border:2px solid #c3cad6;border-radius:50%;background:#fff;transition:border-color .15s;}
  .preset .dot::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--navy);transform:scale(0);transition:transform .15s;}
  .preset .src{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--blue);background:#e8edfb;padding:2px 6px;border-radius:3px;margin-bottom:6px;}
  .preset .t{display:block;font-size:13px;font-weight:600;color:#1c2530;line-height:1.4;}
  .preset .u{display:block;margin-top:5px;color:var(--muted);font-size:11px;word-break:break-all;}
  .preset:has(input:checked){border-color:var(--navy);background:#f7f9ff;box-shadow:0 0 0 1px var(--navy) inset;}
  .preset:has(input:checked) .dot{border-color:var(--navy);}
  .preset:has(input:checked) .dot::after{transform:scale(1);}
  .preset:has(input:focus-visible){outline:2px solid #c7d4f2;outline-offset:2px;}
  .preset:has(input:disabled){opacity:.55;cursor:not-allowed;}
  button{font:inherit;font-size:13px;padding:7px 14px;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--blue);cursor:pointer;}
  button:hover:not(:disabled){background:#eef2fb;}
  button.primary{background:var(--navy);border-color:var(--navy);color:#fff;}
  button.primary:hover:not(:disabled){background:#1a3a7a;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  .status{font-size:13px;color:var(--muted);}
  .status.error{color:var(--red);}

  main{flex:1 1 auto;overflow-y:auto;padding:24px;}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:1400px;margin:0 auto;align-items:start;}
  @media (max-width:900px){ .cols{grid-template-columns:1fr;} }
  .col{border:1px solid var(--border);border-radius:8px;padding:16px;background:#fff;}
  .col.placeholder{display:flex;align-items:center;justify-content:center;min-height:180px;color:var(--muted);font-style:italic;text-align:center;}
  .badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;padding:3px 8px;border-radius:3px;margin-bottom:10px;}
  .badge-orig{background:#fdecea;color:var(--red);}
  .badge-gen{background:#e8edfb;color:var(--blue);}
  .col h2{font-size:18px;margin:0 0 8px;line-height:1.3;}
  .summary{color:var(--muted);font-size:14px;margin:0 0 10px;}
  .meta{font-size:12px;color:var(--muted);margin-bottom:6px;word-break:break-word;}
  .metadata{margin-top:14px;padding-top:10px;border-top:1px dashed var(--border);}
  .metadata h3{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--navy);margin:0 0 8px;}
  .content{font-size:14px;line-height:1.6;margin-top:12px;}
  .content p{margin:0 0 10px;}
  .content h2,.content h3{font-size:15px;margin:16px 0 6px;}
  .content img{max-width:100%;height:auto;}
  .content table{max-width:100%;}
  .content .noncontent{display:none;}
  .usage{margin-top:14px;padding-top:10px;border-top:1px dashed var(--border);font-size:12px;color:var(--muted);}
  .spinner{display:inline-block;width:12px;height:12px;border:2px solid #c7d4f2;border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<header>
  <h1>detikGlobal — Generate New Article</h1>
  <p>Paste a detik.com article URL. The Indonesian source is scraped and its English rewrite generated, side by side.</p>
</header>

<div class="toolbar">
  <div class="tabs" role="tablist">
    <button class="tab active" type="button" role="tab" data-tab="input" aria-selected="true">Paste URL</button>
    <button class="tab" type="button" role="tab" data-tab="preset" aria-selected="false">Pick a sample</button>
  </div>

  <div class="panel active" id="panel-input" role="tabpanel">
    <label for="articleUrl">detik.com URL</label>
    <input id="articleUrl" type="url" placeholder="https://finance.detik.com/…/d-8615053/…" autocomplete="off" spellcheck="false">
  </div>

  <div class="panel" id="panel-preset" role="tabpanel">
    <div class="presets" id="presets" role="radiogroup" aria-label="Sample articles">
      <label class="preset">
        <input type="radio" name="presetUrl" value="https://www.detik.com/bali/nusra/d-8604738/misteri-pria-tewas-telanjang-di-penginapan-usai-check-in-dengan-perempuan" checked>
        <span class="dot" aria-hidden="true"></span>
        <span class="src">detikBali</span>
        <span class="t">Misteri pria tewas telanjang di penginapan usai check-in dengan perempuan</span>
        <span class="u">detik.com/bali/nusra/d-8604738</span>
      </label>
      <label class="preset">
        <input type="radio" name="presetUrl" value="https://wolipop.detik.com/worklife/d-8606706/viral-alumni-sma-bogor-pamer-pindah-ke-as-demi-kejar-mimpi-faktanya-ternyata">
        <span class="dot" aria-hidden="true"></span>
        <span class="src">Wolipop · Worklife</span>
        <span class="t">Viral alumni SMA Bogor pamer pindah ke AS demi kejar mimpi, faktanya ternyata</span>
        <span class="u">wolipop.detik.com/worklife/d-8606706</span>
      </label>
    </div>
  </div>

  <div class="row">
    <button id="generateBtn" class="primary" type="button">Generate New Article</button>
    <span id="status" class="status"></span>
  </div>
</div>

<main>
  <div class="cols">
    <div id="origCol" class="col placeholder">Paste a detik.com URL and click &ldquo;Generate New Article&rdquo;.</div>
    <div id="genCol" class="col placeholder">Generated English output will appear here.</div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const generateBtn = $("generateBtn"), urlInput = $("articleUrl");
const statusEl = $("status"), origCol = $("origCol"), genCol = $("genCol");
const tabs = document.querySelectorAll(".tab");
let activeTab = "input";

tabs.forEach((tab) => tab.addEventListener("click", () => {
  if (generateBtn.disabled) return;
  activeTab = tab.dataset.tab;
  tabs.forEach((t) => {
    const on = t === tab;
    t.classList.toggle("active", on);
    t.setAttribute("aria-selected", String(on));
    $("panel-" + t.dataset.tab).classList.toggle("active", on);
  });
}));

function selectedUrl() {
  if (activeTab === "preset") {
    const picked = document.querySelector('input[name="presetUrl"]:checked');
    return picked ? picked.value : "";
  }
  return urlInput.value.trim();
}

function setStatus(msg, isError, busy) {
  statusEl.className = "status" + (isError ? " error" : "");
  statusEl.innerHTML = busy ? '<span class="spinner"></span>' : "";
  statusEl.append(msg || "");
}

function placeholder(el, text) {
  el.className = "col placeholder";
  el.textContent = text;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// The API may return content as raw HTML or as HTML-entity-escaped text.
function decodeContent(html) {
  const s = String(html ?? "");
  if (/<\s*[a-z]/i.test(s)) return s;
  const ta = document.createElement("textarea");
  ta.innerHTML = s;
  return ta.value;
}

function tagList(value) {
  if (Array.isArray(value)) return value.join(", ");
  return String(value ?? "").split("|").filter(Boolean).join(", ");
}

function renderOriginal(a) {
  const cover = a.image_cover || {};
  origCol.className = "col orig";
  origCol.innerHTML = `
    <div class="badge badge-orig">Input — Original (ID)${a.source_url ? " · scraped" : ""}</div>
    <h2>${esc(a.title)}</h2>
    <p class="summary">${esc(a.resume)}</p>
    <div class="content">${decodeContent(a.content)}</div>
    <div class="metadata">
      <h3>Metadata</h3>
      <div class="meta"><b>Category:</b> ${esc(a.categoryauto) || "&mdash;"} &nbsp;|&nbsp; <b>Tags:</b> ${esc(tagList(a.tags || a.tag))}</div>
      <div class="meta"><b>Keywords:</b> ${esc(tagList(a.keywordauto)) || "&mdash;"}</div>
      <div class="meta"><b>Image caption:</b> ${esc(cover.text) || "&mdash;"}</div>
      <div class="meta"><b>Alt image:</b> ${esc(cover.alt_image) || "&mdash;"}</div>
    </div>`;
}

function renderGenerated(g, usage) {
  const u = usage || g.usage || {};
  const cost = u.cost != null ? `$${Number(u.cost).toFixed(6)}` : "n/a";
  genCol.className = "col gen";
  genCol.innerHTML = `
    <div class="badge badge-gen">Output — Generated (EN)</div>
    <h2>${esc(g.title)}</h2>
    <p class="summary">${esc(g.summary)}</p>
    <div class="content">${decodeContent(g.content)}</div>
    <div class="metadata">
      <h3>Metadata</h3>
      <div class="meta"><b>Category:</b> ${esc(g.categoryauto)} &nbsp;|&nbsp; <b>Tags:</b> ${esc(tagList(g.tags))}</div>
      <div class="meta"><b>Keywords:</b> ${esc(tagList(g.keywordauto))}</div>
      <div class="meta"><b>Image caption:</b> ${esc(g.image_cover_image_text)}</div>
      <div class="meta"><b>Alt image:</b> ${esc(g.image_cover_alt_image)}</div>
    </div>
    <div class="usage">Tokens: ${esc(u.total_tokens ?? "n/a")}
      (in ${esc(u.input_tokens ?? "n/a")} / out ${esc(u.output_tokens ?? "n/a")}) &nbsp;|&nbsp; Cost: ${cost}</div>`;
}

async function api(url, options) {
  const res = await fetch(url, options);
  const data = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function setBusy(busy) {
  generateBtn.disabled = busy;
  urlInput.disabled = busy;
  document.querySelectorAll('input[name="presetUrl"]').forEach((r) => { r.disabled = busy; });
}

// Scrape first so the source shows immediately, then generate the rewrite.
async function generateNewArticle() {
  const url = selectedUrl();
  if (!url) return setStatus(activeTab === "preset" ? "Pick one of the sample articles first." : "Paste a detik.com article URL first.", true, false);

  setBusy(true);
  setStatus("Scraping detik.com…", false, true);
  placeholder(origCol, "Scraping…");
  placeholder(genCol, "Generated English output will appear here.");

  let article;
  try {
    ({ article } = await api(`/api/scrape?url=${encodeURIComponent(url)}`));
    renderOriginal(article);
  } catch (e) {
    placeholder(origCol, "Could not scrape this URL.");
    setStatus(e.message, true, false);
    return setBusy(false);
  }

  setStatus("Generating English rewrite… this can take a while.", false, true);
  placeholder(genCol, "Generating…");
  try {
    const { generated, usage } = await api("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ article }),
    });
    renderGenerated(generated, usage);
    setStatus("Done.", false, false);
  } catch (e) {
    placeholder(genCol, "Generation failed.");
    setStatus(e.message, true, false);
  } finally {
    setBusy(false);
  }
}

generateBtn.addEventListener("click", generateNewArticle);
urlInput.addEventListener("keydown", (e) => { if (e.key === "Enter") generateNewArticle(); });
</script>
</body>
</html>
